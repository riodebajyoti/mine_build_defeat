<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mine Build Defeat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="game-container">
        <div id="crosshair"></div>

        <!-- HUD -->
        <div id="hud">
            <div id="stats">
                <div class="stat-bar">
                    <div class="label">HP</div>
                    <div class="bar-bg">
                        <div id="hp-fill" class="fill red" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="label">ENERGY</div>
                    <div class="bar-bg">
                        <div id="energy-fill" class="fill blue" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div id="inventory-bar">
                <div class="slot active" data-id="1">1</div>
                <div class="slot" data-id="2">2</div>
                <div class="slot" data-id="3">3</div>
                <div class="slot" data-id="4">4</div>
                <div class="slot" data-id="5">5</div>
            </div>

            <div id="ai-helper">
                <div class="helper-avatar">🤖</div>
                <div class="helper-msg" id="helper-text">Ready to mine, Captain?</div>
            </div>
        </div>

        <!-- Overlays -->
        <div id="overlay">
            <div class="modal">
                <h1>MINE BUILD DEFEAT</h1>
                <p>Destroy <b>ios-2</b> before it's too late.</p>
                <button id="start-btn">START MISSION</button>
                <div class="controls-hint">
                    ARROW KEYS to move | CLICK to mine | RIGHT-CLICK to build | ESC to unlock cursor
                </div>
            </div>
        </div>

        <div id="accessories-menu" style="display: none;">
            <div class="mc-inventory">

                <!-- Tabs -->
                <div class="mc-tabs">
                    <button class="mc-tab active" data-cat="all">🗂️</button>
                    <button class="mc-tab" data-cat="weapons">⚔️</button>
                    <button class="mc-tab" data-cat="tools">⛏️</button>
                    <button class="mc-tab" data-cat="armor">🛡️</button>
                    <button class="mc-tab" data-cat="blocks">🛏️</button>
                    <button class="mc-tab" data-cat="food">🍎</button>
                    <button class="mc-tab" data-cat="materials">💎</button>
                    <button class="mc-tab" data-cat="potions">🧪</button>
                    <button class="mc-tab" data-cat="special">✨</button>
                    <button class="mc-tab" data-cat="yours">🎒</button>
                    <button class="mc-close" id="close-accessories-btn">✕</button>
                </div>

                <!-- Title bar -->
                <div class="mc-title" id="mc-tab-title">All Items</div>

                <!-- Item Grid -->
                <div class="mc-grid" id="catalog-grid"></div>

                <!-- Search bar -->
                <div class="mc-search-row">
                    <div class="mc-search-label">🔍 SEARCH</div>
                    <input class="mc-search-input" type="text" id="accessory-search" placeholder="Type item name...">
                    <button class="mc-get-btn" id="accessory-get-btn">GET</button>
                </div>

                <!-- Your hotbar -->
                <div class="mc-hotbar-label">HOTBAR</div>
                <div id="accessories-list" class="mc-your-items"></div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
