<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06131a" />
    <meta
      name="description"
      content="Sign in with ChatGPT, choose one of your worlds, and play Mine Build Defeat."
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://pig-standing.pig-standing.chatgpt.site/"
    />
    <link
      rel="canonical"
      href="https://pig-standing.pig-standing.chatgpt.site/"
    />
    <title>Mine Build Defeat</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        overflow: hidden;
        color: #f4f8f6;
        background:
          radial-gradient(circle at 18% 34%, rgba(25, 205, 177, 0.18), transparent 32rem),
          radial-gradient(circle at 84% 48%, rgba(120, 62, 209, 0.18), transparent 34rem),
          linear-gradient(160deg, #06131a 0%, #02070b 50%, #0c0918 100%);
      }

      main {
        width: min(620px, calc(100% - 40px));
        text-align: center;
      }

      .cube {
        display: grid;
        width: 70px;
        height: 70px;
        margin: 0 auto 28px;
        place-items: center;
        color: #04100d;
        background: linear-gradient(135deg, #78f08d, #5ee9e0);
        clip-path: polygon(50% 0, 100% 25%, 100% 74%, 50% 100%, 0 74%, 0 25%);
        font-size: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 11vw, 86px);
        line-height: 0.84;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
      }

      h1 span:nth-child(2) {
        color: #5ee9e0;
      }

      h1 span:nth-child(3) {
        color: #ffad61;
      }

      p {
        margin: 32px 0 24px;
        color: #9aaba8;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 16px 24px;
        border: 1px solid #a8ffc0;
        color: #031009;
        background: linear-gradient(180deg, #9bffad, #62dd78);
        box-shadow: 0 7px 0 #287f43;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-decoration: none;
      }
    </style>
    <script>
      window.location.replace("https://pig-standing.pig-standing.chatgpt.site/");
    </script>
  </head>
  <body>
    <main>
      <div class="cube" aria-hidden="true">◆</div>
      <h1><span>Mine</span><span>Build</span><span>Defeat</span></h1>
      <p>Opening the complete ChatGPT account and world experience…</p>
      <a href="https://pig-standing.pig-standing.chatgpt.site/">Enter Mine Build Defeat</a>
    </main>
  </body>
</html>
