<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mine Build Defeat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="game-container">
        <div id="crosshair"></div>

        <!-- HUD -->
        <div id="hud">
            <div id="stats">
                <div class="stat-bar">
                    <div class="label">HP</div>
                    <div class="bar-bg">
                        <div id="hp-fill" class="fill red" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="stat-bar">
                    <div class="label">ENERGY</div>
                    <div class="bar-bg">
                        <div id="energy-fill" class="fill blue" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div id="inventory-bar">
                <div class="slot active" data-id="1">1</div>
                <div class="slot" data-id="2">2</div>
                <div class="slot" data-id="3">3</div>
                <div class="slot" data-id="4">4</div>
                <div class="slot" data-id="5">5</div>
            </div>

            <div id="ai-helper">
                <div class="helper-avatar">🤖</div>
                <div class="helper-msg" id="helper-text">Ready to mine, Captain?</div>
            </div>
        </div>

        <!-- Overlays -->
        <div id="overlay">
            <div class="modal">
                <h1>MINE BUILD DEFEAT</h1>
                <p>Destroy <b>ios-2</b> before it's too late.</p>
                <button id="start-btn">START MISSION</button>
                <div class="controls-hint">
                    ARROW KEYS to move | CLICK to mine | RIGHT-CLICK to build | ESC to unlock cursor
                </div>
            </div>
        </div>

        <div id="accessories-menu" style="display: none;">
            <div class="modal large-modal">
                <button class="close-btn" id="close-accessories-btn">X</button>
                <h2>ACCESSORIES & INVENTORY</h2>
                
                <div class="accessories-content">
                    <div class="inventory-section">
                        <h3>Your Items</h3>
                        <div id="accessories-list"></div>
                    </div>
                    
                    <div class="search-section">
                        <h3>Search & Get Free Items</h3>
                        <div class="search-bar-container">
                            <input type="text" id="accessory-search" placeholder="Enter accessory name...">
                            <button id="accessory-get-btn">GET</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
