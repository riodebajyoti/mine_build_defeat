<!doctype html><html><head><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><h1>Adventure checks</h1><pre id="results">Running…</pre><script type="module">
import * as THREE from 'three';import {VoxelWorld} from '../src/world.js';import {Adventure} from '../src/adventure.js';import {SITES} from '../src/adventure_sites.js';
const lines=[];function check(name,value){if(!value)throw Error(name);lines.push('PASS '+name);results.textContent=lines.join('\n');}
try{const scene=new THREE.Scene(),world=new VoxelWorld(scene);for(const s of SITES)for(let x=Math.floor((s.x-5)/16);x<=Math.floor((s.x+5)/16);x++)for(let z=Math.floor((s.z-5)/16);z<=Math.floor((s.z+5)/16);z++)world.generateChunk(x,z);
check('Four landmarks generated',SITES.length===4);check('Cavern entrance open',!world.blocks.has('22,5,-27'));check('Crystal cavern roof present',world.blocks.has('22,10,-23'));check('Ruin doorway open',!world.blocks.has('-27,5,22'));
const total=[...world.chunks.values()].reduce((a,c)=>a+[...c.blocks].length,0),drawn=[...world.chunks.values()].reduce((a,c)=>a+Object.values(c.instancedMeshes).reduce((b,m)=>b+m.count,0),0);check('Buried blocks omitted from rendering',drawn<total*.6);
world.restoreSavedOverrides([['22,10,-23',null]]);check('Saved player edits take precedence',!world.blocks.has('22,10,-23'));
let reward={};const state={isPointerLocked:true,hp:50,addResource:(k,n)=>reward[k]=(reward[k]||0)+n,notify:()=>{}};localStorage.removeItem('mbd-adventure-v1:qa-disposable');const a=new Adventure(scene,{worldId:'qa-disposable',state});a.interact();check('Quest cannot advance remotely',a.stage===0);for(const id of [0,1,2,0]){const s=SITES[id];a.update(.1,new THREE.Vector3(s.x,6.5,s.z));a.interact();}check('Four-stage quest completes',a.stage===4);a.interact();check('Reward granted only once',reward.Steel===12&&reward.Cores===3);const saved=new Adventure(scene,{worldId:'qa-disposable',state});check('Quest progress restored',saved.stage===4);a.update(.1,new THREE.Vector3(24,6,-3));a.interact();a.interact();check('Harvest cannot be spammed',reward.Carrot===4);a.update(180,new THREE.Vector3(24,6,-3));a.interact();check('Crops regrow',reward.Carrot===8);check('Three farm animal species',a.farmAnimals.map(x=>x.species).join(',')==='sheep,pig,cow');localStorage.removeItem('mbd-adventure-v1:qa-disposable');lines.push('ALL CHECKS PASSED');results.textContent=lines.join('\n');
}catch(e){results.textContent+='\nFAIL '+e.stack;}
</script></body></html>
